<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Товар — Ваш Текстиль</title><link rel="stylesheet" href="style.css"><style>.product-media{display:grid;gap:14px}.product-media-main{position:relative;aspect-ratio:4/5;overflow:hidden;background:#eee9e1;border-radius:28px}.product-media-main img,.product-media-main video{width:100%;height:100%;object-fit:cover;display:block}.media-arrow{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border:0;border-radius:50%;background:rgba(255,255,255,.82);backdrop-filter:blur(12px);font-size:20px;cursor:pointer}.media-prev{left:16px}.media-next{right:16px}.media-counter{position:absolute;right:16px;bottom:16px;padding:8px 12px;border-radius:999px;background:rgba(255,255,255,.82);font-size:12px}.product-media-thumbs{display:flex;gap:10px;overflow-x:auto;scrollbar-width:none}.product-media-thumbs::-webkit-scrollbar{display:none}.media-thumb{position:relative;flex:0 0 82px;height:104px;padding:0;border:1px solid transparent;border-radius:14px;overflow:hidden;background:#eee9e1}.media-thumb.active{border-color:#24221f}.media-thumb img{width:100%;height:100%;object-fit:cover}.media-thumb.video-thumb:after{content:'▶';position:absolute;right:7px;bottom:7px;width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:#fff;font-size:11px}@media(max-width:700px){.product-media-main{border-radius:20px;aspect-ratio:1/1.08}.media-thumb{flex-basis:68px;height:84px}}</style></head><body><header class="header"><div class="wrap nav"><a class="logo" href="index.html">Ваш Текстиль<small>HOME · TEXTILE</small></a><nav class="links"><a href="catalog.html">Каталог</a><a href="about.html">Про нас</a><a href="delivery.html">Доставка</a><a href="faq.html">FAQ</a></nav><button class="icon" id="cartOpen">🛒<span class="count">0</span></button></div></header><section class="product-media" aria-label="Фото та відео товару"><div class="product-media-main"><img id="productMainMedia" src="" alt="" loading="eager" decoding="async"><video id="productMainVideo" controls playsinline preload="metadata" hidden></video><button class="media-arrow media-prev" type="button">←</button><button class="media-arrow media-next" type="button">→</button><span class="media-counter" id="mediaCounter">1 / 7</span></div><div class="product-media-thumbs" id="productMediaThumbs"></div></section>
<main><section class="wrap detail" id="productDetail"></section></main><footer class="footer"><div class="wrap"><div class="logo">Ваш Текстиль<small>HOME · TEXTILE</small></div></div></footer><div class="drawer" id="drawer"><aside class="drawerPanel"><div class="drawerHead"><h2>Кошик</h2><button class="icon" id="cartClose">×</button></div><div id="cartItems"></div><div class="total"><span>Разом</span><span id="cartTotal">0 грн</span></div><a class="btn dark" style="display:flex" href="order.html">Оформити →</a></aside></div><script src="config.js"></script><script src="data.js"></script><script src="script.js"></script><script>(()=>{const im=document.getElementById('productMainMedia'),vid=document.getElementById('productMainVideo'),th=document.getElementById('productMediaThumbs'),ct=document.getElementById('mediaCounter');if(!im||!th)return;const media=[{t:'i',s:'https://images.unsplash.com/photo-1584100936595-c0654b55a2e2?auto=format&fit=crop&w=1600&q=88',a:'Преміальна постільна білизна'},{t:'i',s:'https://images.unsplash.com/photo-1631049307264-da0ec9d70304?auto=format&fit=crop&w=1600&q=88',a:'Постільна білизна в інтер’єрі'},{t:'i',s:'https://images.unsplash.com/photo-1616627561950-9f746e330187?auto=format&fit=crop&w=1600&q=88',a:'Фактура домашнього текстилю'},{t:'i',s:'https://images.unsplash.com/photo-1618221195710-dd6b41faaea6?auto=format&fit=crop&w=1600&q=88',a:'Преміальний інтер’єр спальні'},{t:'i',s:'https://images.unsplash.com/photo-1595526114035-0d45ed16cfbf?auto=format&fit=crop&w=1600&q=88',a:'Ліжко з текстилем'},{t:'i',s:'https://images.unsplash.com/photo-1586023492125-27b2c045efd7?auto=format&fit=crop&w=1600&q=88',a:'Деталь текстилю'},{t:'v',s:'https://cdn.coverr.co/videos/coverr-a-woman-making-the-bed-1571/1080p.mp4',p:'https://images.unsplash.com/photo-1631049307264-da0ec9d70304?auto=format&fit=crop&w=1200&q=82'}];let n=0;function show(i){n=(i+media.length)%media.length;let x=media[n];if(x.t==='v'){im.hidden=true;vid.hidden=false;vid.poster=x.p;vid.src=x.s;vid.load()}else{vid.pause();vid.removeAttribute('src');vid.hidden=true;im.hidden=false;im.src=x.s;im.alt=x.a}ct.textContent=`${n+1} / ${media.length}`;[...th.children].forEach((e,j)=>e.classList.toggle('active',j===n))}media.forEach((x,i)=>{let b=document.createElement('button');b.className='media-thumb'+(x.t==='v'?' video-thumb':'');let q=document.createElement('img');q.src=x.t==='v'?x.p:x.s;q.alt='';q.loading='lazy';b.append(q);b.onclick=()=>show(i);th.append(b)});document.querySelector('.media-prev')?.addEventListener('click',()=>show(n-1));document.querySelector('.media-next')?.addEventListener('click',()=>show(n+1));let sx=0;document.querySelector('.product-media-main')?.addEventListener('touchstart',e=>sx=e.changedTouches[0].clientX,{passive:true});document.querySelector('.product-media-main')?.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>45)show(n+(dx<0?1:-1))},{passive:true});show(0)})()</script></body></html>
