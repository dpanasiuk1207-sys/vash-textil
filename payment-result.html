<!doctype html><html lang="uk"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Оплата — Ваш Текстиль</title><link rel="stylesheet" href="style.css"></head><body><main><section class="page hero"><div class="wrap" style="max-width:760px"><span class="eyebrow">ВАШ ТЕКСТИЛЬ · ОПЛАТА</span><h1 id="title">Перевіряємо оплату.</h1><p id="text">Зачекайте кілька секунд. Платіжний сервіс повертає результат.</p><div style="margin-top:30px"><a class="btn dark" href="index.html">На головну</a></div></div></section></main><script>const p=new URLSearchParams(location.search),s=(p.get('status')||'').toLowerCase();if(s==='success'||s==='approved'){title.textContent='Оплату отримано.';text.textContent='Дякуємо. Замовлення передано в обробку.'}else if(s==='declined'||s==='failed'){title.textContent='Оплату не завершено.';text.textContent='Спробуйте ще раз або оберіть післяплату.'}else{text.textContent='Якщо сторінка не оновлюється, перевірте статус замовлення через Instagram.'}</script></body></html>
